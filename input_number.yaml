# Remembers the distance of the last strike you were notified about, so the
# blueprint's "Only Notify for Closer Strikes" option has something to compare
# against. Only needed if you turn that option on.
#
# Add this under your existing `input_number:` block.

lightning_last_distance:
  name: Last Lightning Distance
  icon: mdi:flash-alert
  initial: 1000
  min: 0
  max: 1000
  step: 0.1
  mode: box
